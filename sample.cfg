hostname SW-STACK-01
!
switch 1 provision ws-c3850-48p
switch 1 priority 15
switch 2 provision ws-c3850-48p
switch 2 priority 10
!
vlan 10
 name USERS
!
vlan 20,30
!
vlan 40-42
 name GUEST
!
interface GigabitEthernet1/0/1
 description User port floor1
 switchport mode access
 switchport access vlan 10
!
interface range GigabitEthernet1/0/2-4
 switchport mode access
 switchport access vlan 10
 shutdown
!
interface TenGigabitEthernet1/1/1
 description Uplink to core
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30-32
 switchport trunk allowed vlan add 40
 switchport trunk allowed vlan remove 20
 switchport trunk native vlan 10
!
interface GigabitEthernet1/0/10
 channel-group 1 mode active
!
interface GigabitEthernet1/0/11
 channel-group 1 mode active
!
interface Port-channel1
 description Server LAG
 switchport mode trunk
 switchport trunk allowed vlan 10,40-42
 switchport trunk native vlan 10
!
interface GigabitEthernet2/0/1
 description Routed uplink
 no switchport
 ip address 10.0.0.1 255.255.255.252
!
interface GigabitEthernet1/0/48
 description Disabled port
 shutdown
 switchport mode access
 switchport access vlan 99
!
