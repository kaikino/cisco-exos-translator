hostname SW-STACK-DEMO
!
switch 1 provision ws-c3850-12s
switch 1 priority 15
switch 2 provision ws-c3850-12s
switch 2 priority 10
!
vlan 10
 name USERS
!
vlan 20
 name SERVERS
!
vlan 100
 name VOICE
!
interface range GigabitEthernet1/0/1-8
 description Floor1 user port
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
!
interface range GigabitEthernet2/0/1-8
 description Floor2 user port
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
!
interface GigabitEthernet1/0/10
 description Server LAG member A
 channel-group 1 mode active
!
interface GigabitEthernet2/0/10
 description Server LAG member B
 channel-group 1 mode active
!
interface Port-channel1
 description Cross-member server LAG
 switchport mode trunk
 switchport trunk allowed vlan 10,20,100
!
interface GigabitEthernet2/0/12
 description UNUSED
 shutdown
!
interface TenGigabitEthernet1/1/1
 description Uplink to core
 switchport mode trunk
 switchport trunk native vlan 10
 switchport trunk allowed vlan 10,20,100
!
end
