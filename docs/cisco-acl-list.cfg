! =====================================================================
! Cisco ACL リスト
! =====================================================================
hostname ACL-SAMPLES
!
vlan 10
 name USERS
!
! --------------------------------------------------------------------
! 1. standard numbered ACL (1-99, 1300-1999)
! --------------------------------------------------------------------
access-list 10 permit 10.99.0.1
access-list 10 permit 10.1.0.0 0.0.0.255
access-list 10 deny any
!
! --------------------------------------------------------------------
! 2. extended numbered ACL (100-199, 2000-2699)
! --------------------------------------------------------------------
access-list 100 permit tcp 10.1.0.0 0.0.0.255 any eq 443
access-list 100 permit udp any host 10.2.0.10 range 5000 5100
access-list 100 permit icmp any any
access-list 100 deny ip any any
!
! --------------------------------------------------------------------
! 3. named standard ACL
! --------------------------------------------------------------------
ip access-list standard MGMT
 permit 10.99.0.0 0.0.0.255
!
! --------------------------------------------------------------------
! 4. named extended ACL (remark・シーケンス番号・プロトコル番号つき)
! --------------------------------------------------------------------
ip access-list extended SERVERS-IN
 remark Allow web and ssh to servers
 10 permit tcp any host 10.2.0.5 eq 22
 20 permit tcp 10.1.0.0 0.0.0.255 host 10.2.0.5 range 8000 8080
 30 permit 47 any any
 40 deny ip any any
!
! --------------------------------------------------------------------
! 5. 物理ポートへの in 適用 (→ .pol + configure access-list ... ingress)
! --------------------------------------------------------------------
interface GigabitEthernet1/0/1
 switchport mode access
 switchport access vlan 10
 ip access-group SERVERS-IN in
!
interface GigabitEthernet1/0/2
 switchport mode access
 switchport access vlan 10
 ip access-group 100 in
!
! ====================================================================
! ここから下は警告として報告される構文 (手動移行・今後対応候補)
! ====================================================================
ip access-list extended WARN-EXAMPLES
 permit tcp any any established
 deny ip any any log
 permit tcp any any eq www
 permit tcp any gt 1023 any
 permit ip 10.1.0.0 0.0.255.0 any
!
! out 方向の適用は警告
interface GigabitEthernet1/0/3
 switchport mode access
 switchport access vlan 10
 ip access-group 100 out
!
! SVI への適用 = Router ACL (VLAN への ingress 適用として変換。
! 注意: EXOS は VLAN 内ブリッジ通信もフィルタするため Cisco より厳しい)
interface Vlan10
 ip address 10.10.10.1 255.255.255.0
 ip access-group SERVERS-IN in
!
end
